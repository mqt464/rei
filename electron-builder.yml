appId: io.github.mqt464.rei
productName: rei
directories:
  buildResources: build
extraResources:
  - from: resources/consent-o-matic/LICENSE
    to: licenses/consent-o-matic-LICENSE
  - from: resources/commands
    to: commands
  - from: resources/extensions
    to: extensions
  - from: resources/sources
    to: sources
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - '!resources/commands/**'
  - '!resources/extensions/**'
  - '!resources/sources/**'
  - '!**/.vscode/*'
  - '!src/*'
  - '!docs/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!svelte.config.mjs'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  target:
    - nsis
    - portable
  executableName: rei
  icon: build/icon.ico
nsis:
  include: build/default-browser.nsh
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
portable:
  artifactName: ${name}-${version}-portable.${ext}
mac:
  protocols:
    - name: Web links
      schemes:
        - http
        - https
      role: Viewer
  target:
    - dmg
    - zip
  icon: build/icon.icns
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  protocols:
    - name: Web links
      schemes:
        - http
        - https
  icon: build/icon.png
  target:
    - AppImage
    - snap
    - deb
  maintainer: n/a
  category: Network;WebBrowser
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: mqt464
  repo: rei
  releaseType: draft
